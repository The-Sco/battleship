<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
<script defer src="main.js"></script></head>
<body>
  <div class="game">
    <div class="boards">
      <div class="endGameDialog hidden">
        <h1 class="resultMessage">You won!</h1>
        <button class="resetGameButton">Restart game</button>
      </div>
      <div class="gameboard"></div>
      <div class="enemyBoard"></div>
    </div>
    <div class="placementButtons">
      <div class="buttonDiv">
        <button class="placementButton placementButton-5 active" data-length="5">x5</button>
        <span class="label shipsLeft-5">left: 1</span>
      </div>
      <div class="buttonDiv">
        <button class="placementButton placementButton-4" data-length="4">x4</button>
        <span class="label shipsLeft-4">left: 2</span>
      </div>
      <div class="buttonDiv">
        <button class="placementButton placementButton-3" data-length="3">x3</button>
        <span class="label shipsLeft-3">left: 3</span>
      </div>
      <div class="buttonDiv">
        <button class="placementButton placementButton-2" data-length="2">x2</button>
        <span class="label shipsLeft-2">left: 4</span>
      </div>
      <div class="buttonDiv changeOrientDiv">
        <button class="changeOrientButton">Change orientation</button>
        <span class="label currentOrient">Now: horizontal</span>
      </div>
      <div class="buttonDiv startGameDiv">
        <button class="startGameButton" disabled>Start game</button>
      </div>
    </div>
  </div>
  <div class="sideButtonDiv">
    <button class="sideButton helpButton">Help</button>  
    <button class="sideButton resetGameButton">Restart game</button>
  </div>
  <dialog class="helpDialog">
    <p>You must first place all your ships before you start the game.</p>
    <p>You can change the orientation by pressing the R key.</p>
    <button class="closeDialogButton">Close</button>
  </dialog>
</body>
</html>
